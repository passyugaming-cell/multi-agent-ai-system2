name: PR #33 Verification

on:
  workflow_dispatch:

jobs:
  test-pr33:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_business_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ai_business_os_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout PR #33
        uses: actions/checkout@v4
        with:
          ref: refs/pull/33/head

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            fastapi \
            uvicorn \
            sqlalchemy \
            asyncpg \
            alembic \
            pydantic \
            pydantic-settings \
            python-dotenv \
            pytest \
            pytest-asyncio \
            httpx \
            PyJWT \
            redis \
            google-genai

      - name: Run PR #33 approval tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_business_os_test
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_business_os_test
        run: |
          pytest tests/test_approvals_and_tasks.py -q
