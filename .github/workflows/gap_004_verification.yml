name: GAP-004 Source of Truth Verification

on:
  push:
    branches: [ repair/gap-004-source-of-truth-matrix-v2, main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  postgres-verification:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ai_business_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U user -d ai_business_os_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install Dependencies
        run: poetry install --no-root

      - name: Install Extra Test Packages
        run: |
          poetry run pip install pytest pytest-asyncio httpx "pydantic[email]" google-genai redis PyJWT cryptography aiosqlite email-validator

      - name: Run Alembic Migrations on PostgreSQL
        env:
          DATABASE_URL: "postgresql+asyncpg://user:password@localhost:5432/ai_business_os_test"
          TEST_DATABASE_URL: "postgresql+asyncpg://user:password@localhost:5432/ai_business_os_test"
        run: |
          poetry run alembic upgrade head

      - name: Run GAP-004 Source of Truth Verification Suite on PostgreSQL
        env:
          DATABASE_URL: "postgresql+asyncpg://user:password@localhost:5432/ai_business_os_test"
          TEST_DATABASE_URL: "postgresql+asyncpg://user:password@localhost:5432/ai_business_os_test"
        run: |
          poetry run pytest tests/test_gap_004_source_of_truth_matrix.py tests/test_gap_002_authority_matrix.py -v
