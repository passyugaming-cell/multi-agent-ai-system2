name: PR #37 PostgreSQL 16 Verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-pr37:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_business_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ai_business_os_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            fastapi \
            uvicorn \
            sqlalchemy \
            asyncpg \
            alembic \
            pydantic \
            pydantic-settings \
            python-dotenv \
            pytest \
            pytest-asyncio \
            httpx \
            PyJWT \
            redis \
            google-genai \
            aiosqlite \
            cryptography \
            email-validator

      - name: Run Alembic Upgrade Head & Schema Validation
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_business_os_test
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_business_os_test
        run: |
          echo "=== ALEMBIC UPGRADE HEAD ==="
          poetry run alembic upgrade head || alembic upgrade head

          echo "=== ALEMBIC CURRENT & HEADS ==="
          alembic current
          alembic heads

          echo "=== POSTGRESQL SCHEMA VERIFICATION ==="
          python -c "
          import asyncio, asyncpg

          async def verify():
              conn = await asyncpg.connect('postgresql://postgres:postgres@localhost:5432/ai_business_os_test')

              # 1. Verify 5 Phase 6 tables
              tables = ['integrations', 'integration_connections', 'integration_credentials', 'integration_executions', 'webhook_configs']
              for t in tables:
                  res = await conn.fetchval(\"SELECT to_regclass('public.' || \$1)\", t)
                  assert res is not None, f'Missing table: {t}'
                  print(f'Table verified: {t}')

              # 2. Verify Phase A 9 parent composite unique constraints
              phase_a_tables = [
                  'workflow_configurations', 'workflow_executions', 'customers',
                  'conversations', 'orders', 'products', 'integration_connections',
                  'subscriptions', 'invoices'
              ]
              for pat in phase_a_tables:
                  cname = f'uq_{pat}_tenant_id'
                  has_c = await conn.fetchval(
                      \"SELECT count(*) FROM pg_constraint WHERE conname = \$1\", cname
                  )
                  assert has_c > 0, f'Missing Phase A constraint: {cname}'
                  print(f'Phase A constraint verified: {cname}')

              # 3. Verify downstream constraints on integration_connections & integrations
              has_cat_uniq = await conn.fetchval(
                  \"SELECT count(*) FROM pg_class WHERE relname = 'uq_catalog_integrations_provider'\"
              )
              assert has_cat_uniq > 0, 'Missing uq_catalog_integrations_provider index'

              has_act_uniq = await conn.fetchval(
                  \"SELECT count(*) FROM pg_class WHERE relname = 'uq_active_provider_external_account'\"
              )
              assert has_act_uniq > 0, 'Missing uq_active_provider_external_account index'

              print('All PostgreSQL table and constraint verifications PASSED!')
              await conn.close()

          asyncio.run(verify())
          "

      - name: Run Pytest Regression Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_business_os_test
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_business_os_test
        run: |
          pytest -q
