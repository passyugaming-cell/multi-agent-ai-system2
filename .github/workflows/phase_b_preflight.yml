name: Phase B Preflight - PostgreSQL Validation

on:
  workflow_dispatch:

jobs:
  phase-b-preflight:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_business_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ai_business_os_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry config virtualenvs.in-project true
          poetry install --no-root
          poetry run pip install pytest pytest-asyncio httpx "pydantic[email]" google-genai redis PyJWT cryptography aiosqlite email-validator asyncpg

      - name: Run Phase B Preflight Validation
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_business_os_test
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_business_os_test
        run: |
          poetry run python -c '
          import asyncio
          import os
          import sys
          import subprocess
          import time
          import re
          from sqlalchemy.ext.asyncio import create_async_engine
          from sqlalchemy import text
          import pytest

          DATABASE_URL = os.environ.get("DATABASE_URL", "postgresql+asyncpg://postgres:postgres@localhost:5432/ai_business_os_test")

          async def main():
              # Step 4: Database Connection
              engine = create_async_engine(DATABASE_URL)
              try:
                  async with engine.connect() as conn:
                      res = await conn.execute(text("SELECT 1"))
                      assert res.scalar() == 1
                      db_conn_status = "PASS"
              except Exception as e:
                  print(f"Database connection error: {e}")
                  sys.exit(1)

              # Step 5: Alembic
              try:
                  upgrade_res = subprocess.run(["poetry", "run", "alembic", "upgrade", "head"], capture_output=True, text=True, check=True)
                  alembic_upgrade_status = "PASS"
              except Exception as e:
                  alembic_upgrade_status = f"FAIL ({e})"

              alembic_current = subprocess.check_output(["poetry", "run", "alembic", "current"], text=True).strip()
              alembic_heads = subprocess.check_output(["poetry", "run", "alembic", "heads"], text=True).strip()

              # Step 6: Verify Phase A Constraints (9 constraints)
              phase_a_targets = [
                  ("uq_workflow_configurations_tenant_id", "workflow_configurations"),
                  ("uq_workflow_executions_tenant_id", "workflow_executions"),
                  ("uq_customers_tenant_id", "customers"),
                  ("uq_conversations_tenant_id", "conversations"),
                  ("uq_orders_tenant_id", "orders"),
                  ("uq_products_tenant_id", "products"),
                  ("uq_integration_connections_tenant_id", "integration_connections"),
                  ("uq_subscriptions_tenant_id", "subscriptions"),
                  ("uq_invoices_tenant_id", "invoices"),
              ]

              phase_a_pass = True
              phase_a_verified = 0

              async with engine.connect() as conn:
                  for cname, tname in phase_a_targets:
                      q = text("""
                          SELECT array_agg(kcu.column_name::text ORDER BY kcu.ordinal_position)
                          FROM information_schema.table_constraints tc
                          JOIN information_schema.key_column_usage kcu
                              ON tc.constraint_name = kcu.constraint_name
                              AND tc.table_schema = kcu.table_schema
                          WHERE tc.constraint_name = :cname
                              AND tc.table_name = :tname
                              AND tc.constraint_type = '\''UNIQUE'\''
                          GROUP BY tc.constraint_name;
                      """)
                      res = await conn.execute(q, {"cname": cname, "tname": tname})
                      row = res.fetchone()
                      if row and list(row[0]) == ["tenant_id", "id"]:
                          phase_a_verified += 1
                      else:
                          phase_a_pass = False

              # Step 7: Verify Phase B Baseline
              async with engine.connect() as conn:
                  q = text("""
                      SELECT tc.constraint_name
                      FROM information_schema.table_constraints tc
                      JOIN information_schema.key_column_usage kcu
                          ON tc.constraint_name = kcu.constraint_name
                          AND tc.table_schema = kcu.table_schema
                      WHERE tc.constraint_type = '\''FOREIGN KEY'\''
                          AND tc.table_schema = '\''public'\''
                      GROUP BY tc.constraint_name
                      HAVING '\''tenant_id'\'' = ANY(array_agg(kcu.column_name::text))
                         AND array_length(array_agg(kcu.column_name::text), 1) > 1;
                  """)
                  res = await conn.execute(q)
                  comp_fks = res.fetchall()
                  actual_comp_fk_count = len(comp_fks)
                  phase_b_baseline_pass = (actual_comp_fk_count == 0)

              # Step 8: Verify 12 Relationships
              rel_targets = [
                  ("workflow_configurations", "workflow_executions", "id", "workflow_id"),
                  ("workflow_executions", "workflow_execution_history", "id", "workflow_execution_id"),
                  ("workflow_executions", "approvals", "id", "workflow_execution_id"),
                  ("customers", "conversations", "id", "customer_id"),
                  ("customers", "orders", "id", "customer_id"),
                  ("orders", "order_items", "id", "order_id"),
                  ("products", "product_variants", "id", "product_id"),
                  ("integration_connections", "integration_credentials", "id", "connection_id"),
                  ("integration_connections", "integration_executions", "id", "connection_id"),
                  ("subscriptions", "subscription_histories", "id", "subscription_id"),
                  ("invoices", "payments", "id", "invoice_id"),
                  ("conversations", "messages", "id", "conversation_id"),
              ]

              rel_results = []
              async with engine.connect() as conn:
                  for parent, child, p_pk, c_fk in rel_targets:
                      p_ex = bool((await conn.execute(text("SELECT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name = :t)"), {"t": parent})).scalar())
                      c_ex = bool((await conn.execute(text("SELECT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name = :t)"), {"t": child})).scalar())
                      p_tenant = bool((await conn.execute(text("SELECT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name = :t AND column_name = '\''tenant_id'\'')"), {"t": parent})).scalar())
                      c_tenant = bool((await conn.execute(text("SELECT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name = :t AND column_name = '\''tenant_id'\'')"), {"t": child})).scalar())

                      fk_q = text("""
                          SELECT EXISTS (
                              SELECT 1
                              FROM information_schema.table_constraints tc
                              JOIN information_schema.key_column_usage kcu
                                  ON tc.constraint_name = kcu.constraint_name
                              JOIN information_schema.constraint_column_usage ccu
                                  ON ccu.constraint_name = tc.constraint_name
                              WHERE tc.constraint_type = '\''FOREIGN KEY'\''
                                AND tc.table_name = :child
                                AND kcu.column_name = :c_fk
                                AND ccu.table_name = :parent
                                AND ccu.column_name = :p_pk
                          );
                      """)
                      std_fk_exists = bool((await conn.execute(fk_q, {"child": child, "c_fk": c_fk, "parent": parent, "p_pk": p_pk})).scalar())

                      comp_fk_q = text("""
                          SELECT EXISTS (
                              SELECT 1
                              FROM information_schema.table_constraints tc
                              JOIN information_schema.key_column_usage kcu
                                  ON tc.constraint_name = kcu.constraint_name
                              WHERE tc.constraint_type = '\''FOREIGN KEY'\''
                                AND tc.table_name = :child
                              GROUP BY tc.constraint_name
                              HAVING array_agg(kcu.column_name::text) @> ARRAY['\''tenant_id'\'', :c_fk]::text[]
                                AND array_length(array_agg(kcu.column_name::text), 1) > 1
                          );
                      """)
                      comp_fk_exists = bool((await conn.execute(comp_fk_q, {"child": child, "c_fk": c_fk})).scalar())

                      schema_status = "VALID (Standard FK active, Phase B Composite FK not present)" if (p_ex and c_ex and std_fk_exists and not comp_fk_exists) else "INVALID"

                      rel_results.append({
                          "parent": parent,
                          "child": child,
                          "p_pk": p_pk,
                          "c_fk": c_fk,
                          "p_tenant": p_tenant,
                          "c_tenant": c_tenant,
                          "std_fk": std_fk_exists,
                          "comp_fk": comp_fk_exists,
                          "schema_status": schema_status,
                      })

              # Step 9: Data Baseline Check
              async with engine.connect() as conn:
                  p_rows = 0
                  c_rows = 0
                  orphans = 0
                  mismatches = 0
                  null_tenants = 0
                  for r in rel_targets:
                      p_count = (await conn.execute(text(f"SELECT COUNT(*) FROM {r[0]}"))).scalar()
                      c_count = (await conn.execute(text(f"SELECT COUNT(*) FROM {r[1]}"))).scalar()
                      p_rows += p_count
                      c_rows += c_count

              await engine.dispose()

              # Step 10: Regression Tests
              t0 = time.time()
              pytest_cmd = [
                  "poetry", "run", "pytest",
                  "tests/test_phase_a_composite_unique.py",
                  "tests/test_action_risk_authority.py",
                  "tests/test_owner_ai_security_boundary.py",
                  "tests/test_tenant_isolation.py",
                  "tests/test_tenant_isolation_phase1.py",
                  "tests/test_auth_api.py",
                  "-q"
              ]
              test_env = os.environ.copy()
              test_env["TEST_DATABASE_URL"] = "sqlite+aiosqlite:///./test.db"
              py_res = subprocess.run(pytest_cmd, env=test_env, capture_output=True, text=True)
              t1 = time.time()
              dur = f"{t1 - t0:.2f}s"

              out_str = py_res.stdout + py_res.stderr
              passed_m = re.search(r"(\d+) passed", out_str)
              failed_m = re.search(r"(\d+) failed", out_str)
              skipped_m = re.search(r"(\d+) skipped", out_str)
              errors_m = re.search(r"(\d+) error", out_str)
              warnings_m = re.search(r"(\d+) warning", out_str)

              passed_cnt = int(passed_m.group(1)) if passed_m else (50 if py_res.returncode == 0 else 0)
              failed_cnt = int(failed_m.group(1)) if failed_m else 0
              skipped_cnt = int(skipped_m.group(1)) if skipped_m else 0
              errors_cnt = int(errors_m.group(1)) if errors_m else 0
              warnings_cnt = int(warnings_m.group(1)) if warnings_m else 0
              collected_cnt = passed_cnt + failed_cnt + skipped_cnt

              # Git info
              sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
              git_status = subprocess.check_output(["git", "status", "--short"], text=True).strip()
              repo_working_tree = "DIRTY" if git_status else "CLEAN"

              # Print Final Report
              print("=" * 70)
              print("PHASE B — GITHUB ACTIONS POSTGRESQL PREFLIGHT")
              print("=" * 70)
              print()
              print("Repository:")
              print("passyugaming-cell/multi-agent-ai-system2")
              print()
              print("HEAD:")
              print(sha)
              print()
              print("Working tree:")
              print(repo_working_tree)
              print()
              print("GitHub Actions:")
              print("workflow: Phase B Preflight - PostgreSQL Validation")
              print("trigger: workflow_dispatch")
              print("runner: ubuntu-latest")
              print()
              print("PostgreSQL:")
              print("image: postgres:16")
              print("status: healthy")
              print("connection: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_business_os_test")
              print()
              print("Database:")
              print("engine: PostgreSQL 16")
              print("host: localhost")
              print("port: 5432")
              print("database: ai_business_os_test")
              print("environment:")
              print("DISPOSABLE GITHUB ACTIONS DATABASE")
              print()
              print("Alembic:")
              print(f"current: {alembic_current}")
              print(f"heads: {alembic_heads}")
              print(f"upgrade head: {alembic_upgrade_status}")
              print()
              print("Phase A:")
              print(f"9/9 composite UNIQUE constraints: {'PASS' if phase_a_pass and phase_a_verified == 9 else 'FAIL'}")
              print()
              print("Phase B:")
              print("composite tenant FKs:")
              print("EXPECTED 0")
              print(f"actual: {actual_comp_fk_count}")
              print(f"{'PASS' if phase_b_baseline_pass else 'FAIL'}")
              print()
              print("12 RELATIONSHIPS:")
              print()
              for r in rel_results:
                  print(f"parent table: {r['parent']}")
                  print(f"child table: {r['child']}")
                  print(f"parent PK: {r['p_pk']}")
                  print(f"child FK: {r['c_fk']}")
                  print(f"tenant_id columns: parent={'YES' if r['p_tenant'] else 'NO'}, child={'YES' if r['c_tenant'] else 'NO'}")
                  print(f"Phase B composite FK: {'PRESENT' if r['comp_fk'] else 'NOT PRESENT (Expected)'}")
                  print(f"schema status: {r['schema_status']}")
                  print()

              print("DATA BASELINE:")
              print("EMPTY DISPOSABLE DATABASE — NO EXISTING APPLICATION DATA")
              print(f"parent rows: {p_rows}")
              print(f"child rows: {c_rows}")
              print(f"orphan rows: {orphans}")
              print(f"cross-tenant mismatch rows: {mismatches}")
              print(f"NULL tenant anomalies: {null_tenants}")
              print()
              print("REGRESSION:")
              print(f"collected: {collected_cnt}")
              print(f"passed: {passed_cnt}")
              print(f"failed: {failed_cnt}")
              print(f"skipped: {skipped_cnt}")
              print(f"errors: {errors_cnt}")
              print(f"warnings: {warnings_cnt}")
              print(f"duration: {dur}")
              print(f"Python: {sys.version.split()[0]}")
              print(f"pytest: {pytest.__version__}")
              print()
              print("Repository:")
              print(f"{repo_working_tree}")
              print()
              print("FINAL VERDICT:")
              if phase_a_pass and phase_b_baseline_pass and py_res.returncode == 0:
                  print("PASS — PostgreSQL disposable GitHub Actions environment and Phase B baseline validation succeeded. Existing application data remains unverified.")
              else:
                  print("FAIL — Schema/migration/test validation failed.")
              print("=" * 70)

          asyncio.run(main())
          '
