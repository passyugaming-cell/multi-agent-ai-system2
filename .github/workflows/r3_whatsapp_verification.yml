name: R3 WhatsApp Reliability Verification

on:
  push:
    branches: [ main, repair/*, feature/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  whatsapp-verification:
    name: WhatsApp E2E & Concurrency Verification (PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ai_business_os_test
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install Dependencies
        run: |
          poetry install --no-root
          poetry run pip install "pytest>=8.1.1" "pytest-asyncio>=0.23.6" "httpx>=0.27.0" "pydantic[email]" "google-genai" "redis" "PyJWT" "cryptography" "aiosqlite" "email-validator"

      - name: Verify Migration Upgrade / Downgrade Roundtrip
        env:
          DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/ai_business_os_test
        run: |
          poetry run alembic upgrade head
          poetry run alembic downgrade 72dbe1a9c9ce
          poetry run alembic upgrade head

      - name: Run WhatsApp Reliability Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/ai_business_os_test
        run: |
          poetry run pytest tests/test_r3_whatsapp_reliability.py tests/test_whatsapp_cloud_api.py tests/test_whatsapp_tenant_mapping.py tests/test_whatsapp_and_handoff.py -v
